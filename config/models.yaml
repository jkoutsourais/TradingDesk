# Model names live here, never in code. Chosen 2026-09-23 from the Ollama library for a
# 16 GB RTX 5080: the deep model must fit entirely on the GPU, and the GPU cannot hold the
# deep and small models together, so the scheduler unloads before every shift.

deep:
  model: gpt-oss:20b
  num_ctx: 16384
  temperature: 0.3
  # gpt-oss reasoning effort: low, medium or high.
  think: medium
  # Released explicitly at shift end; this only covers a crashed shift.
  keep_alive: 20m

small:
  model: qwen3.5:9b
  num_ctx: 8192
  temperature: 0.1
  think: false
  # Unloads after 10 idle minutes (CLAUDE.md model rule).
  keep_alive: 10m

embedding:
  model: nomic-embed-text
  # Must match the vector column width in migration 0005; the embedder checks every reply.
  dimensions: 768
  # nomic-embed-text is trained with task prefixes on each input.
  document_prefix: "search_document: "
  query_prefix: "search_query: "
  # CPU only, so embeddings never compete with the deep model for the 16 GB GPU.
  cpu_only: true
  keep_alive: 10m
  batch_size: 64
